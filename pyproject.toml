[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-ferme"
description = "The latest results of the Formula 1 championship and races"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[project.scripts]
recap-ferme = "recap_ferme.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9"
]
